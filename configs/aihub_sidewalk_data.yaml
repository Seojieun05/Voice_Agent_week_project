# Ultralytics data config for the converted AIHub sidewalk dataset.
# Generate the dataset first:
#   python scripts/convert_cvat_xml.py \
#     --xml datasets/raw/aihub/sidewalk/train/*.xml \
#     --images-root datasets/raw/aihub/sidewalk/train \
#     --output-root datasets/processed/aihub_sidewalk \
#     --class-mapping configs/aihub_sidewalk_classes.json \
#     --split train --val-fraction 0.1 --link-mode symlink
# NOTE: Ultralytics resolves a relative `path` against its global
# datasets_dir, not this file's location — use an absolute path
# (adjust to your checkout location).
path: /home/student/Voice_Agent_week_project/datasets/processed/aihub_sidewalk
train: images/train
val: images/val
